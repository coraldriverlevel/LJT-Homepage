# Temporary CI workflow: verifies the Jekyll site builds without any
# GitHub Pages deployment steps.
name: Jekyll build check

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify expected pages were generated
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          ls _site/publication/
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "EMNLP 2024" _site/publications/index.html
